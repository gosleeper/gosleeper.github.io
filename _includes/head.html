<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b17">
  <meta name="author" content="{{ site.author }}">
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 150 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="keywords" content="{{ site.keyword }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.nickname }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 150 }}">
  <title>{% if page.title %}{{ page.title }} · {{ site.nickname }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/img/wang-yaozu-icon.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/wang-yaozu-id.png' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" href="{{ '/rss.xml' | relative_url }}" title="{{ site.title }}">
  <link rel="stylesheet" href="{{ '/assets/css/nightlog.css' | relative_url }}">
</head>
